[package]
name = "rkllm"
version = "0.1.0"
description = "Safe Rust bindings to the Rockchip RKLLM runtime"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["link"]
# Resolve the RKLLM symbols at link time.
link = ["rkllm-sys/link"]
# Resolve them at run time by dlopen-ing librkllmrt.so.
libloading = ["rkllm-sys/libloading"]
# Adds RkllmSession::run_llm_async, which yields a Stream of chunks.
tokio = ["dep:tokio", "dep:futures-core"]

[dependencies]
rkllm-sys = { version = "0.1.0", path = "../rkllm-sys", default-features = false }
tokio = { version = "1", features = ["rt", "sync"], optional = true }
futures-core = { version = "0.3", optional = true }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }

[package.metadata.docs.rs]
all-features = true
