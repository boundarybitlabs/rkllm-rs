[package]
name = "rkllm-sys"
version = "0.1.0"
description = "Raw FFI bindings to librkllmrt, the Rockchip RKLLM runtime"
links = "rkllmrt"
build = "build.rs"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["libloading"]
# Resolve the RKLLM symbols at run time by dlopen-ing librkllmrt.so.
libloading = ["dep:libloading"]
# Resolve them at link time against librkllmrt instead.
link = []

[dependencies]
libloading = { version = "0.8", optional = true }
